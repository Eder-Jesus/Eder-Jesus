<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="100%" height="230">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c1b"/>
      <stop offset="45%" stop-color="#241434"/>
      <stop offset="85%" stop-color="#4d1b40"/>
      <stop offset="100%" stop-color="#e0536c"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffd2dc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
  </defs>

  <rect width="900" height="230" rx="16" fill="url(#bgGradient)"/>
  <circle cx="820" cy="40" r="120" fill="#e0536c" opacity="0.25" filter="url(#glow)"/>
  <circle cx="80" cy="190" r="100" fill="#8a2be2" opacity="0.2" filter="url(#glow)"/>
  <rect width="898" height="228" x="1" y="1" rx="15" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <g transform="translate(50, 40)">
    <rect x="0" y="0" width="180" height="26" rx="13" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="90" y="17" fill="#ffb4c4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">FOUNDER &amp; BUILDER</text>

    <text x="0" y="68" fill="url(#textGradient)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5">Eder Jesus</text>
    <text x="215" y="68" fill="#e0536c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400"> (Edzxra)</text>

    <text x="0" y="100" fill="#f0d5dd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
      Co-Founder @ <tspan font-weight="700" fill="#ffffff">i6 Systems (Gestor Educ &amp; AVAEE)</tspan>  |  Data Engineer &amp; BI @ <tspan font-weight="700" fill="#ffffff">Grupo Elo</tspan>
    </text>

    <g transform="translate(0, 122)">
      <rect x="0" y="0" width="185" height="26" rx="6" fill="rgba(255,255,255,0.08)"/>
      <text x="14" y="17" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Gestor Educ &amp; AVAEE</text>

      <rect x="195" y="0" width="170" height="26" rx="6" fill="rgba(255,255,255,0.08)"/>
      <text x="207" y="17" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Medallion Architecture</text>

      <rect x="375" y="0" width="165" height="26" rx="6" fill="rgba(255,255,255,0.08)"/>
      <text x="387" y="17" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">SQL Performance 120x</text>

      <rect x="550" y="0" width="175" height="26" rx="6" fill="rgba(255,255,255,0.08)"/>
      <text x="562" y="17" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Peak Radiant | Imortal</text>
    </g>
  </g>
</svg>
